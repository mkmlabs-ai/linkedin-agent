[project]
name = "linkedin-agent"
version = "1.0.0"
description = "Scheduled LinkedIn activity agent built on Claude Code skills and a local browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "MKM Labs" }]
requires-python = ">=3.9"
dependencies = []
classifiers = ["Operating System :: MacOS", "Programming Language :: Python :: 3"]

[project.scripts]
li = "linkedin_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".claude/skills/li-human"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
