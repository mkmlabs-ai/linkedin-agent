    <rect x="20" y="20" width="40" height="26" rx="13" fill="#7c5cff" fill-opacity="0.18"/>
    <text x="40" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#7c5cff">04</text>
    <text x="20" y="84" font-size="22" font-weight="800" fill="#ffffff">Ego Lite</text>
    <text x="20" y="116" font-size="14.5" fill="#9fb0cc">Twoja zalogowana sesja</text>
    <text x="20" y="140" font-size="14.5" fill="#7f8ea8">działa w tle</text>
  </g>
  <line x1="1012" y1="155" x2="1044" y2="155" stroke="#5b7bb3" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" transform="translate(1052 70)">
