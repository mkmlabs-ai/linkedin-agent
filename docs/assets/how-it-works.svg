    <text x="20" y="116" font-size="14.5" fill="#9fb0cc">post, komentarze</text>
    <text x="20" y="140" font-size="14.5" fill="#7f8ea8">odpowiedzi, reakcje</text>
  </g>
  <path d="M1156.0 246 V306 H264.0" fill="none" stroke="#5b7bb3" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <rect x="36.0" y="284" width="220" height="44" rx="14" fill="#141f36" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="146.0" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#4ade80">raport na maila</text>
  <text x="688.0" y="298" text-anchor="middle" font-size="14" fill="#7f8ea8">każda akcja trafia do data/log.jsonl, a po sesji dostajesz krótki raport</text>
