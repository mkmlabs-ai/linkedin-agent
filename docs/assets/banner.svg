<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2d8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2d8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="1010" cy="250" r="380" fill="url(#glow)"/>
  <circle cx="160" cy="620" r="320" fill="url(#glow2)"/>

  <!-- left: copy -->
  <g transform="translate(80 150)">
    <rect width="300" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="20" cy="18" r="5" fill="#22c55e"/>
    <text x="34" y="24" font-size="15" fill="#cfe0ff" font-weight="600" letter-spacing="0.3">Claude Code  ·  Ego Lite  ·  bez API</text>

    <text x="0" y="112" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">linkedin-agent</text>
    <text x="0" y="170" font-size="32" font-weight="700" fill="#ffffff">Twój LinkedIn aktywny 3 razy dziennie.</text>
    <text x="0" y="214" font-size="20" fill="#9fb0cc">Posty, komentarze i odpowiedzi pisane Twoim głosem,</text>
    <text x="0" y="242" font-size="20" fill="#9fb0cc">w Twojej przeglądarce, na Twoim komputerze.</text>

    <g transform="translate(0 290)" font-size="17" font-weight="700">
      <rect width="104" height="44" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2d8cff" stroke-opacity="0.6"/>
      <text x="52" y="28" text-anchor="middle" fill="#ffffff">08:05</text>
      <rect x="120" width="104" height="44" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2d8cff" stroke-opacity="0.6"/>
      <text x="172" y="28" text-anchor="middle" fill="#ffffff">12:35</text>
      <rect x="240" width="104" height="44" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2d8cff" stroke-opacity="0.6"/>
      <text x="292" y="28" text-anchor="middle" fill="#ffffff">18:15</text>
      <text x="364" y="28" fill="#7f8ea8" font-weight="500" font-size="16">+ losowe opóźnienie</text>
    </g>
  </g>

  <!-- right: post card -->
  <g filter="url(#shadow)" transform="translate(760 92)">
    <rect width="440" height="250" rx="20" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="44" cy="46" r="22" fill="url(#accent)"/>
    <rect x="80" y="30" width="150" height="12" rx="6" fill="#e6eefc" fill-opacity="0.85"/>
    <rect x="80" y="52" width="96" height="9" rx="4.5" fill="#7f8ea8" fill-opacity="0.6"/>
    <rect x="330" y="32" width="86" height="26" rx="13" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="373" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">post dnia</text>
    <rect x="24" y="92" width="392" height="11" rx="5.5" fill="#c9d6ee" fill-opacity="0.55"/>
    <rect x="24" y="114" width="360" height="11" rx="5.5" fill="#c9d6ee" fill-opacity="0.45"/>
    <rect x="24" y="136" width="300" height="11" rx="5.5" fill="#c9d6ee" fill-opacity="0.35"/>
    <rect x="24" y="166" width="392" height="54" rx="12" fill="#2d8cff" fill-opacity="0.10"/>
    <text x="40" y="199" font-size="15" fill="#9cc7ff" font-weight="600">A wy jak to robicie u siebie?</text>
  </g>

  <!-- comment bubble -->
  <g filter="url(#shadow)" transform="translate(700 372)">
    <rect width="420" height="96" rx="18" fill="#141f36" stroke="#2d8cff" stroke-opacity="0.45"/>
    <rect x="20" y="20" width="96" height="24" rx="12" fill="#2d8cff" fill-opacity="0.18"/>
    <text x="68" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#9cc7ff">komentarz</text>
    <rect x="130" y="27" width="140" height="10" rx="5" fill="#7f8ea8" fill-opacity="0.55"/>
    <rect x="20" y="60" width="370" height="10" rx="5" fill="#c9d6ee" fill-opacity="0.5"/>
  </g>

  <!-- reply bubble -->
  <g filter="url(#shadow)" transform="translate(840 492)">
    <rect width="360" height="84" rx="18" fill="#161d33" stroke="#7c5cff" stroke-opacity="0.5"/>
    <rect x="20" y="18" width="104" height="24" rx="12" fill="#7c5cff" fill-opacity="0.2"/>
    <text x="72" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">odpowiedź</text>
    <rect x="20" y="54" width="300" height="10" rx="5" fill="#c9d6ee" fill-opacity="0.45"/>
  </g>

  <!-- bottom-left: guard rails -->
  <g transform="translate(80 540)" font-size="15" fill="#7f8ea8">
    <text x="0" y="0">limity dzienne  ·  tryb próbny  ·  awaryjny STOP  ·  raport na maila</text>
  </g>
</svg>
