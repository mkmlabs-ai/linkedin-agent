<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1f3a"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity="0.06"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2d8cff" stop-opacity="0.35"/><stop offset="1" stop-color="#2d8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2d8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="24" fill="url(#dots)"/>
  <circle cx="420" cy="280" r="360" fill="url(#glow)"/>

  <!-- left: terminal-style question card -->
  <g filter="url(#shadow)" transform="translate(60 60)">
    <rect width="700" height="440" rx="20" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="28" cy="28" r="7" fill="#ff5f57"/><circle cx="50" cy="28" r="7" fill="#febc2e"/><circle cx="72" cy="28" r="7" fill="#28c840"/>
    <text x="350" y="33" text-anchor="middle" font-size="14" fill="#7f8ea8">Claude Code · linkedin-agent</text>
    <line x1="0" y1="56" x2="700" y2="56" stroke="#ffffff" stroke-opacity="0.08"/>

    <text x="32" y="98" font-size="14" font-weight="700" fill="#7f8ea8" letter-spacing="1.5">KROK 3 Z 9</text>
    <rect x="32" y="110" width="636" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="32" y="110" width="212" height="6" rx="3" fill="url(#bar)"/>

    <text x="32" y="164" font-size="25" font-weight="800" fill="#ffffff">Ile razy dziennie agent ma zaglądać</text>
    <text x="32" y="196" font-size="25" font-weight="800" fill="#ffffff">na LinkedIna?</text>

    <g transform="translate(32 226)">
      <rect width="636" height="56" rx="14" fill="#2d8cff" fill-opacity="0.16" stroke="#2d8cff"/>
      <circle cx="30" cy="28" r="10" fill="none" stroke="#2d8cff" stroke-width="2.5"/><circle cx="30" cy="28" r="5" fill="#2d8cff"/>
      <text x="56" y="34" font-size="18" font-weight="700" fill="#ffffff">3 razy: rano, w południe, wieczorem</text>
      <rect x="500" y="16" width="116" height="24" rx="12" fill="#22c55e" fill-opacity="0.18"/>
      <text x="558" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">polecane</text>
    </g>
    <g transform="translate(32 294)">
      <rect width="636" height="56" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="30" cy="28" r="10" fill="none" stroke="#5b6b88" stroke-width="2.5"/>
      <text x="56" y="34" font-size="18" fill="#c9d6ee">2 razy: rano i wieczorem</text>
    </g>
    <g transform="translate(32 362)">
      <rect width="636" height="56" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="30" cy="28" r="10" fill="none" stroke="#5b6b88" stroke-width="2.5"/>
      <text x="56" y="34" font-size="18" fill="#c9d6ee">1 raz: rano</text>
    </g>
  </g>

  <!-- right: checklist -->
  <g transform="translate(830 92)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#7f8ea8" letter-spacing="2">KREATOR PYTA, TY KLIKASZ</text>
    <g font-size="18" transform="translate(0 44)">
      <circle cx="12" cy="-6" r="12" fill="#22c55e" fill-opacity="0.2"/><path d="M6 -6 l4 4 l8 -9" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="36" y="0" fill="#c9d6ee">Sprawdza komputer</text>
    </g>
    <g font-size="18" transform="translate(0 90)">
      <circle cx="12" cy="-6" r="12" fill="#22c55e" fill-opacity="0.2"/><path d="M6 -6 l4 4 l8 -9" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="36" y="0" fill="#c9d6ee">LinkedIn w Ego Lite</text>
    </g>
    <g font-size="18" font-weight="700" transform="translate(0 136)">
      <circle cx="12" cy="-6" r="12" fill="#2d8cff"/><text x="12" y="0" text-anchor="middle" font-size="13" fill="#fff">3</text>
      <text x="36" y="0" fill="#ffffff">Rytm: sesje, posty, komentarze</text>
    </g>
    <g font-size="18" fill="#7f8ea8">
      <g transform="translate(0 188)"><circle cx="12" cy="-6" r="12" fill="none" stroke="#3b4a66" stroke-width="2"/><text x="12" y="0" text-anchor="middle" font-size="13">4</text><text x="36" y="0">Kim jesteś i tematy</text></g>
      <g transform="translate(0 234)"><circle cx="12" cy="-6" r="12" fill="none" stroke="#3b4a66" stroke-width="2"/><text x="12" y="0" text-anchor="middle" font-size="13">5</text><text x="36" y="0">Twój styl pisania</text></g>
      <g transform="translate(0 280)"><circle cx="12" cy="-6" r="12" fill="none" stroke="#3b4a66" stroke-width="2"/><text x="12" y="0" text-anchor="middle" font-size="13">6</text><text x="36" y="0">Ustawienia i powiadomienia</text></g>
      <g transform="translate(0 326)"><circle cx="12" cy="-6" r="12" fill="none" stroke="#3b4a66" stroke-width="2"/><text x="12" y="0" text-anchor="middle" font-size="13">7</text><text x="36" y="0">Próbka: brzmi jak Ty?</text></g>
      <g transform="translate(0 372)"><circle cx="12" cy="-6" r="12" fill="none" stroke="#3b4a66" stroke-width="2"/><text x="12" y="0" text-anchor="middle" font-size="13">8</text><text x="36" y="0">Próbnie czy na żywo</text></g>
      <g transform="translate(0 418)"><circle cx="12" cy="-6" r="12" fill="none" stroke="#3b4a66" stroke-width="2"/><text x="12" y="0" text-anchor="middle" font-size="13">9</text><text x="36" y="0">Start harmonogramu</text></g>
    </g>
  </g>
</svg>
